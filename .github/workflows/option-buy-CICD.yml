name: Build and Deploy Nifty Interceptor

on:
  push:
    branches:
      - master   # or your target branch
  workflow_dispatch:

env:
  NIFTY_IMAGE_NAME: nifty-interceptor:${{ github.run_number }}
  STRADDLE_IMAGE_NAME: nifty-interceptor-signal:${{ github.run_number }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.NIFTY_IMAGE_NAME }} ./executor
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.STRADDLE_IMAGE_NAME }} ./signal
      - name: Push Docker image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.NIFTY_IMAGE_NAME }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.STRADDLE_IMAGE_NAME }}

      - name: Deploy to Option Buy
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp job update \
              --name nifty-interceptor \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.NIFTY_IMAGE_NAME }}

      - name: Deploy to Signal Job
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp job update \
              --name nifty-interceptor-signal \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.STRADDLE_IMAGE_NAME }}

      - name: Restart running Signal jobs
        uses: azure/CLI@v1
        with:
          inlineScript: |
            running_jobs=$(az containerapp job execution list --name nifty-interceptor-signal --resource-group ${{ secrets.RESOURCE_GROUP }} --query "[?properties.status=='Running']")
            if [ "$running_jobs" != "[]" ]; then
              az containerapp job stop -n nifty-interceptor-signal -g ${{ secrets.RESOURCE_GROUP }}
              az containerapp job start -n nifty-interceptor-signal -g ${{ secrets.RESOURCE_GROUP }}
            fi

      - name: Restart running Option Buy jobs
        uses: azure/CLI@v1
        with:
          inlineScript: |
            running_jobs=$(az containerapp job execution list --name nifty-interceptor --resource-group ${{ secrets.RESOURCE_GROUP }} --query "[?properties.status=='Running']")
            if [ "$running_jobs" != "[]" ]; then
              az containerapp job stop -n nifty-interceptor -g ${{ secrets.RESOURCE_GROUP }}
              az containerapp job start -n nifty-interceptor -g ${{ secrets.RESOURCE_GROUP }}
            fi
